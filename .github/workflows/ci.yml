name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest tests/host -q

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - program: scanner
            artifact: site-scanner
            image: site_scanner.bin
          - program: survey
            artifact: lora-survey
            image: lora_survey.bin
    defaults:
      run:
        shell: bash
        working-directory: firmware/${{ matrix.program }}
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig set-target esp32s3
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            firmware/${{ matrix.program }}/build/flash_args
            firmware/${{ matrix.program }}/build/${{ matrix.image }}
            firmware/${{ matrix.program }}/build/bootloader/bootloader.bin
            firmware/${{ matrix.program }}/build/partition_table/partition-table.bin
