name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest tests/host -q

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    defaults:
      run:
        shell: bash
        working-directory: firmware/scanner
    steps:
      - name: Trust the workspace
        working-directory: /
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig set-target esp32s3
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig build
      - uses: actions/upload-artifact@v4
        with:
          name: site-scanner
          path: |
            firmware/scanner/build/flash_args
            firmware/scanner/build/site_scanner.bin
            firmware/scanner/build/bootloader/bootloader.bin
            firmware/scanner/build/partition_table/partition-table.bin
